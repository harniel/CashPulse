# Local dev/demo stack (Section 21).
#
# Usage: docker compose up --build
#
# Reads backend env vars straight from backend/.env.example, which is
# *already* written for these exact Compose service names (DB_HOST=db,
# CELERY_BROKER_URL=redis://redis:6379/0) — see backend/README.md for why
# that's a separate file from the SQLite `.env` used for non-Docker local
# dev (copying one over the other breaks whichever setup you're not using).
#
# frontend's VITE_API_BASE_URL isn't set here on purpose — the browser
# (not the container) makes the actual API calls, so it always talks to
# http://localhost:8000 regardless of what's containerized, matching the
# client code's own default.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: finance_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      target: dev
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.example
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      target: dev
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.example
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      # Named volume "wins" over the bind mount above for this one path,
      # so the container keeps its own Linux-built node_modules instead
      # of whatever the host OS installed (macOS/arm64 here) — mixing
      # the two is a classic source of native-binding breakage. Trade-off:
      # this volume doesn't track package.json — after `npm install <pkg>`
      # on the host, run `docker compose exec frontend npm install` (or
      # `docker compose restart frontend` to pick it up) or the container
      # will 500 on an import Vite can't resolve. Hit exactly this running
      # up the Dashboard feature (added @mui/x-charts on the host only).
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
