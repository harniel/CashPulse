# Local dev/demo stack (Section 21). No `frontend` service yet — there's
# no frontend code in the repo (Section 11 is still "not started"); this
# file gets a frontend service once one exists, same reasoning as the CI
# workflow omitting a frontend job for now.
#
# Usage: docker compose up --build
#
# Reads env vars straight from backend/.env.example, which is *already*
# written for these exact Compose service names (DB_HOST=db,
# CELERY_BROKER_URL=redis://redis:6379/0) — see backend/README.md for why
# that's a separate file from the SQLite `.env` used for non-Docker local
# dev (copying one over the other breaks whichever setup you're not using).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: finance_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    build:
      context: ./backend
      target: dev
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.example
    depends_on:
      - db
      - redis

  celery-beat:
    build:
      context: ./backend
      target: dev
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.example
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
